name: FlashView Android 16 Release APK

on:
  push:
    branches: [main]
    paths:
      - 'buildparts/**'
      - 'overrides/**'
      - '.github/workflows/flashview-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            buildparts/project.b64.part00 \
            buildparts/project.b64.part01 \
            buildparts/project.b64.part02 \
            buildparts/project.b64.part03a \
            buildparts/project.b64.part03b0 \
            buildparts/project.b64.part03b1 \
            buildparts/project.b64.part03c0 \
            buildparts/project.b64.part03d0 \
            buildparts/project.b64.part03d1 \
            buildparts/project.b64.part03d2 \
            buildparts/project.b64.part03d3 \
            buildparts/project.b64.part03d4 \
            buildparts/project.b64.part03c2 \
            buildparts/project.b64.part03c3 \
            buildparts/project.b64.part03c4 \
            buildparts/project.b64.part04 \
            buildparts/project.b64.part05 \
            buildparts/project.b64.part06 > project.b64
          base64 --decode project.b64 > project.zip
          echo '0aac2184602d4092dcfdbf48094902251ce418428674ef84ea16ed0e5ad15611  project.zip' | sha256sum -c -
          unzip -t project.zip
          unzip -o project.zip
          rm -f project.b64 project.zip

      - name: Apply v1.5 phone UI redesign
        shell: bash
        run: |
          set -euo pipefail
          cat \
            overrides/ui-patches.part00 \
            overrides/ui-patches.part01 \
            overrides/ui-patches.part02 \
            overrides/ui-patches.part03 > "$RUNNER_TEMP/ui-patches.tgz.b64"
          base64 --decode "$RUNNER_TEMP/ui-patches.tgz.b64" > "$RUNNER_TEMP/ui-patches.tgz"
          echo 'b890695f8d5c575301572172619b600bcda9070042c250646ae9c2b8e2348d83  '"$RUNNER_TEMP/ui-patches.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ui-patches"
          tar -xzf "$RUNNER_TEMP/ui-patches.tgz" -C "$RUNNER_TEMP/ui-patches"
          patch -p4 < "$RUNNER_TEMP/ui-patches/main.patch"
          patch -p4 < "$RUNNER_TEMP/ui-patches/settings.patch"
          sed -i -E 's/compileSdk [0-9]+/compileSdk 36/' app/build.gradle
          sed -i -E 's/targetSdk [0-9]+/targetSdk 36/' app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode 5/' app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "1.5.0"/' app/build.gradle
          grep -q 'showQuickControls' app/src/main/java/com/spawder/flashview/MainActivity.java
          grep -q 'registerPredictiveBack' app/src/main/java/com/spawder/flashview/MainActivity.java
          grep -q 'Ayarlar • telefon düzeni' app/src/main/java/com/spawder/flashview/SettingsActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build minified release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:clean :app:assembleRelease
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Sign and verify RELEASE APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*release*.apk' | head -n1)"
          test -n "$UNSIGNED"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          PASS="$(openssl rand -hex 32)"
          KEYSTORE="$RUNNER_TEMP/flashview-stable-release.jks"
          ALIGNED="$RUNNER_TEMP/flashview-release-aligned.apk"
          FINAL="$RUNNER_TEMP/FlashView-v1.5.0-Android16-release.apk"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias flashview-release -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=FlashView Stable Release,O=FlashView Personal,C=TR'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias flashview-release --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$FINAL" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL" | tee "$RUNNER_TEMP/apksigner-verify.txt"
          "$ZIPALIGN" -c -v 4 "$FINAL" | tee "$RUNNER_TEMP/zipalign-verify.txt"
          "$AAPT" dump badging "$FINAL" | tee "$RUNNER_TEMP/aapt-badging.txt"
          "$AAPT" dump xmltree "$FINAL" AndroidManifest.xml | tee "$RUNNER_TEMP/manifest-tree.txt"
          grep -F "package: name='com.spawder.flashview' versionCode='5' versionName='1.5.0'" "$RUNNER_TEMP/aapt-badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/aapt-badging.txt"
          if grep -E 'A: android:(debuggable|testOnly).*0xffffffff' "$RUNNER_TEMP/manifest-tree.txt"; then echo 'ERROR: debuggable=true or testOnly=true detected' >&2; exit 1; fi
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/sha256.txt"
          printf 'alias=flashview-release\nstorePassword=%s\nkeyPassword=%s\n' "$PASS" "$PASS" > "$RUNNER_TEMP/signing-credentials.txt"
          cp "$FINAL" "$GITHUB_WORKSPACE/FlashView-v1.5.0-Android16-release.apk"
          cp "$KEYSTORE" "$GITHUB_WORKSPACE/FlashView-v1.5-stable-release.jks"
          cp "$RUNNER_TEMP/signing-credentials.txt" "$GITHUB_WORKSPACE/signing-credentials.txt"
          cp "$RUNNER_TEMP/apksigner-verify.txt" "$GITHUB_WORKSPACE/apksigner-verify.txt"
          cp "$RUNNER_TEMP/zipalign-verify.txt" "$GITHUB_WORKSPACE/zipalign-verify.txt"
          cp "$RUNNER_TEMP/aapt-badging.txt" "$GITHUB_WORKSPACE/aapt-badging.txt"
          cp "$RUNNER_TEMP/manifest-tree.txt" "$GITHUB_WORKSPACE/manifest-tree.txt"
          cp "$RUNNER_TEMP/sha256.txt" "$GITHUB_WORKSPACE/sha256.txt"

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashView-v1.5.0-Android16-RELEASE
          path: |
            FlashView-v1.5.0-Android16-release.apk
            FlashView-v1.5-stable-release.jks
            signing-credentials.txt
            apksigner-verify.txt
            zipalign-verify.txt
            aapt-badging.txt
            manifest-tree.txt
            sha256.txt
          if-no-files-found: error
          retention-days: 1
